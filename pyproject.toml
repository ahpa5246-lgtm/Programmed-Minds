[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "programmed-minds"
version = "0.1.0"
description = "Evidence-driven research, design and verification agents"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
live = ["openai>=2,<3"]

[project.scripts]
pminds = "programmed_minds.cli:main"

[tool.setuptools.packages.find]
include = ["programmed_minds*"]

[tool.setuptools.package-data]
programmed_minds = ["resources/*.yml"]
