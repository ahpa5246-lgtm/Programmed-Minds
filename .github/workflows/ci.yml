name: Original tool verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests-and-static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install core and original Semgrep
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip install semgrep
      - name: Core tests
        run: python -m unittest discover -s tests -v
      - name: Project-specific Semgrep rules
        run: semgrep scan --config integrations/semgrep/python.yml --error --strict --metrics=off --disable-version-check programmed_minds
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3; personal repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
  dependencies:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@7f58dd6750d78fc29a900ba64b1a0f946f62fba4 # v2.6.0
    with:
      scan-args: |-
        --recursive
        ./
      upload-sarif: false
      fail-on-vuln: true
  repository-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          scanners: vuln,misconfig,secret
          exit-code: '1'
          severity: HIGH,CRITICAL
          format: table
